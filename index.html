<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b24" />
    <meta name="description" content="在永夜里建一座工厂，把白昼送回去。" />
    <title>把白昼送回去</title>
  </head>
  <body>
    <div id="app" class="shell" data-opening="true" aria-busy="true">
      <header class="masthead">
        <div class="brand"><span class="sunmark" aria-hidden="true"></span><h1>把白昼送回去</h1></div>
        <div class="balances" aria-label="持有物资">
          <div class="balance" id="iron-balance" hidden><span class="resource" aria-hidden="true"></span><span>铁矿</span><strong id="iron-count">0</strong></div>
          <div class="balance" id="plate-balance" hidden><span class="resource plate" aria-hidden="true"></span><span>结构件</span><strong id="plate-count">0</strong></div>
          <div class="balance" id="kit-balance" hidden><span class="resource kit" aria-hidden="true"></span><span>套件</span><strong id="kit-count">0</strong></div>
        </div>
        <button class="button quiet archive" type="button" data-action="archive">档案</button>
      </header>

      <main class="workbench" aria-label="工厂控制台">
        <section id="map" class="map" aria-label="工厂地图">
          <canvas id="world" aria-label="曙港矿区的可编辑工厂地图"></canvas>
          <div class="map-heading"><div class="sector"><span></span> 曙港矿区</div><div id="map-layer" class="map-layer">货流视图</div></div>
          <div id="map-labels" class="map-labels" aria-hidden="true"></div>
          <button id="ore-action" type="button" class="button local-action" data-action="ore-action" hidden></button>
          <span id="ore-gain" class="ore-gain" aria-live="polite" hidden></span>
          <div id="lesson" class="lesson" hidden></div>
          <div id="notice" class="notice" role="status" hidden></div>
          <div class="map-controls" aria-label="镜头控制">
            <button class="button square" type="button" data-action="home" aria-label="回到工厂">◎</button>
            <button class="button square" type="button" data-action="zoom-out" aria-label="缩小地图">−</button>
            <button class="button square" type="button" data-action="zoom-in" aria-label="放大地图">+</button>
          </div>
          <div id="palette" class="palette" aria-label="建筑目录" hidden>
            <div class="palette-header"><strong>建筑目录</strong><button class="button quiet" type="button" data-action="close-palette">收起</button></div>
            <div id="tools" class="tool-grid"></div>
          </div>
          <div id="draft" class="draft" aria-label="施工草稿" hidden></div>
          <div id="loading" class="loading" role="status"><span class="sunmark" aria-hidden="true"></span><p>正在接入曙港矿区…</p></div>
        </section>

        <aside id="panel" class="panel" data-expanded="false" aria-label="工厂检查器">
          <div class="panel-heading">
            <div><span class="panel-tag" id="panel-tag">任务通讯</span><h2 id="panel-title">矿站启动</h2></div>
            <button id="panel-toggle" class="button quiet panel-toggle" type="button" data-action="toggle-panel" aria-expanded="false">展开</button>
          </div>
          <div class="panel-body" id="panel-body"></div>
        </aside>
      </main>

      <footer class="console">
        <nav class="modes" aria-label="操作模式">
          <button type="button" class="mode" data-mode="view" aria-pressed="true"><span aria-hidden="true">⌖</span>查看</button>
          <button type="button" class="mode" data-mode="build" aria-pressed="false"><span aria-hidden="true">▧</span>建造</button>
          <button type="button" class="mode" data-mode="power" aria-pressed="false"><span aria-hidden="true">ϟ</span>电网</button>
          <button type="button" class="mode" data-mode="orbit" aria-pressed="false"><span aria-hidden="true">◔</span>轨道</button>
        </nav>
        <div class="run-state" aria-label="模拟时间">
          <span id="clock">00:00</span>
          <button class="button quiet speed" type="button" data-action="speed" aria-label="切换模拟速度">1×</button>
        </div>
      </footer>
    </div>

    <dialog id="archive-dialog" class="dialog" aria-labelledby="archive-title">
      <div class="dialog-head"><h2 id="archive-title">矿站档案</h2><button class="button quiet" type="button" data-action="close-dialog">关闭</button></div>
      <p>测试版更新不考虑存档继承。</p>
      <p id="save-status" role="status">当前战役会自动保存到此浏览器。</p>
      <div class="dialog-actions"><button class="button" type="button" data-action="save">立即保存</button><button class="button" type="button" data-action="export">导出存档</button><button class="button" type="button" data-action="import">导入存档</button></div>
      <input id="save-file" type="file" accept=".dawn,application/octet-stream" hidden />
      <div class="dialog-actions"><button class="button" type="button" data-action="pause">暂停模拟</button><button class="button danger" type="button" data-action="reset-confirm">新战役</button></div>
      <p id="reset-warning" hidden>开始新战役将替换当前本地进度。<button class="button danger" type="button" data-action="reset">确认重新开始</button></p>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
