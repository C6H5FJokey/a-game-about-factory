<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101b24" />
    <meta name="description" content="在永夜里建一座工厂，把白昼送回去。" />
    <title>把白昼送回去</title>
  </head>
  <body>
    <div id="app" class="shell" aria-busy="true">
      <header class="masthead">
        <div class="brand"><span class="sunmark" aria-hidden="true"></span><h1>把白昼送回去</h1></div>
        <div id="balances" class="balances" aria-label="持有物资" data-i18n-label="ui.stock"></div>
        <button class="button quiet archive" type="button" data-action="archive" data-i18n="ui.archive">档案</button>
      </header>

      <main class="workbench" aria-label="工厂控制台">
        <section id="map" class="map" aria-label="工厂地图">
          <canvas id="world" aria-label="可编辑工厂地图"></canvas>
          <div id="map-labels" class="map-labels" aria-hidden="true"></div>
          <div id="ground-markers" class="ground-markers" aria-label="地面物品" data-i18n-label="ui.groundItems"></div>
          <div id="ground-drop-hint" class="ground-drop-hint" hidden>
            <span id="ground-drop-context"></span>
            <button class="button" type="button" data-action="cancel-drop" data-i18n="ui.cancelDrop">取消丢弃</button>
          </div>
          <span id="map-harvest" class="map-harvest" aria-hidden="true" hidden><span class="harvest-fill"></span></span>
          <span id="ore-gain" class="ore-gain" aria-live="polite" hidden></span>
          <div id="notice" class="notice" role="status" hidden></div>
          <div class="map-controls" aria-label="镜头控制">
            <button class="button square" type="button" data-action="home" aria-label="回到工厂">◎</button>
            <button class="button square" type="button" data-action="zoom-out" aria-label="缩小地图">−</button>
            <button class="button square" type="button" data-action="zoom-in" aria-label="放大地图">+</button>
          </div>
          <div id="draft" class="draft" aria-label="施工草稿" hidden></div>
          <div id="loading" class="loading" role="status"><span class="sunmark" aria-hidden="true"></span><p>正在接入曙港矿区…</p></div>
        </section>

        <aside id="panel" class="panel" data-expanded="false" aria-label="工厂检查器">
          <button id="panel-toggle" class="panel-toggle" type="button" data-action="toggle-panel" aria-label="工厂面板" aria-controls="panel-surface" aria-expanded="false"><span aria-hidden="true">•••</span></button>
          <div class="panel-surface" id="panel-surface" inert>
            <div class="panel-heading"><div><span class="panel-tag" id="panel-tag">任务通讯</span><h2 id="panel-title">矿站启动</h2></div><div id="panel-tools"></div></div>
            <nav class="modes drawer-modes" aria-label="工厂页面">
              <button type="button" class="mode" data-mode="task" data-i18n="ui.tasks" aria-pressed="true">任务</button>
              <button type="button" class="mode" data-mode="view" data-i18n="ui.operations" aria-pressed="false">操作</button>
              <button type="button" class="mode" data-mode="build" data-i18n="ui.build" aria-pressed="false">建造</button>
              <button type="button" class="mode" data-mode="power" data-i18n="ui.grid" aria-pressed="false">电网</button>
              <button type="button" class="mode" data-mode="guide" data-i18n="ui.guide" aria-pressed="false">手册</button>
            </nav>
            <nav id="panel-tabs" class="panel-tabs" aria-label="建造栏目" hidden></nav>
            <div class="panel-body" id="panel-body"></div>
          </div>
        </aside>
      </main>

      <footer class="console">
        <nav class="modes" aria-label="轨道入口">
          <button type="button" class="mode" data-mode="orbit" aria-pressed="false"><span aria-hidden="true">◔</span><span data-i18n="ui.orbit">轨道</span></button>
        </nav>
        <div class="run-state" aria-label="模拟时间">
          <span id="clock">00:00</span>
          <button class="button quiet speed" type="button" data-action="speed" aria-label="切换模拟速度">1×</button>
        </div>
      </footer>
    </div>
    <div id="quick-info" class="quick-info" hidden></div>
    <div id="item-drag" class="item-drag" aria-hidden="true" hidden></div>

    <dialog id="archive-dialog" class="dialog" aria-labelledby="archive-title">
      <div class="dialog-head"><h2 id="archive-title" data-i18n="ui.archiveTitle">矿站档案</h2><button class="button quiet" type="button" data-action="close-dialog" data-i18n="ui.close">关闭</button></div>
      <p data-i18n="ui.archiveCompatibility">支持导入 V4 至 V10 战役。V11 保存地面物品与建造支付记录。</p>
      <label class="language-setting"><span data-i18n="ui.language">语言</span><select id="language-select"></select></label>
      <p id="save-status" role="status" data-i18n="ui.saveStatus">当前战役会自动保存到此浏览器。</p>
      <div class="dialog-actions"><button class="button" type="button" data-action="save">立即保存</button><button class="button" type="button" data-action="export">导出存档</button><button class="button" type="button" data-action="import">导入存档</button></div>
      <input id="save-file" type="file" accept=".dawn,application/octet-stream" hidden />
      <div class="dialog-actions"><button class="button" type="button" data-action="pause">暂停模拟</button><button class="button danger" type="button" data-action="reset-confirm">新战役</button></div>
      <p id="reset-warning" hidden>开始新战役将替换当前本地进度。<button class="button danger" type="button" data-action="reset">确认重新开始</button></p>
    </dialog>
    <dialog id="blueprint-dialog" class="dialog" aria-labelledby="blueprint-dialog-title">
      <form id="blueprint-form">
        <h2 id="blueprint-dialog-title">保存蓝图</h2>
        <label id="blueprint-label">蓝图名称 <input id="blueprint-name" type="text" maxlength="64" /></label>
        <p id="blueprint-delete-text" hidden></p>
        <p id="blueprint-error" class="dialog-error" role="alert" hidden></p>
        <div class="dialog-actions"><button type="button" class="button" data-action="dismiss-blueprint">取消</button><button type="submit" class="button primary" id="blueprint-submit">保存</button></div>
      </form>
    </dialog>
    <dialog id="transfer-dialog" class="dialog" aria-labelledby="transfer-title">
      <form id="transfer-form">
        <h2 id="transfer-title">指定转移数量</h2>
        <label>件数 <input id="transfer-quantity" type="number" min="1" step="1" required inputmode="numeric" /></label>
        <div class="dialog-actions"><button type="button" class="button" data-action="dismiss-quantity">取消</button><button type="submit" class="button primary">应用</button></div>
      </form>
    </dialog>
    <dialog id="drop-dialog" class="dialog" aria-labelledby="drop-title">
      <form id="drop-form">
        <h2 id="drop-title" data-i18n="ui.dropTitle">丢弃物品</h2>
        <p id="drop-material"></p>
        <label><span data-i18n="ui.dropQuantity">件数</span> <input id="drop-quantity" type="number" min="1" step="1" required inputmode="numeric" /></label>
        <div class="dialog-actions">
          <button type="button" class="button" data-action="close-drop-dialog" data-i18n="ui.cancelDrop">取消丢弃</button>
          <button type="submit" class="button primary" data-i18n="ui.chooseDropSite">选择落点</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
